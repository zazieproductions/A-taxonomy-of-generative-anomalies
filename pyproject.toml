[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-archive"
version = "0.1.0"
description = "Ingestion, validation, and exhibition tools for experimental language-model generations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
anomaly-archive = "anomaly_archive.cli:main"

[tool.setuptools]
packages = ["anomaly_archive"]
